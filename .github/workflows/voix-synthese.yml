name: Lire un livre en voix de synthèse

# Lance la lecture d'un livre par Pocket TTS (Kyutai) sur les machines de GitHub.
# Actions → « Lire un livre en voix de synthèse » → Run workflow.

on:
  workflow_dispatch:
    inputs:
      epub:
        description: "Adresse de l'EPUB (export Wikisource : https://ws-export.wmcloud.org/?lang=fr&page=…&format=epub-3)"
        required: true
        default: "https://ws-export.wmcloud.org/?lang=fr&page=Candide%2C_ou_l%E2%80%99Optimisme%2FGarnier_1877&format=epub-3"
      auteur:
        description: "Auteur"
        default: "Voltaire"
      titre:
        description: "Titre"
        default: "Candide"
      identifiant:
        description: "Identifiant court (nom de la Release), ex. voltaire-candide"
        default: "voltaire-candide"
      chapitres:
        description: "Chapitres à lire : « 1-3 », « 2,5 », vide = tout le livre"
        default: "1-3"
      voix:
        description: "Voix"
        type: choice
        default: estelle
        options: [estelle, marius, javert, caro_davy, bill_boerst, peter_yearsley, stuart_bell]
      machines:
        description: "Nombre de machines en parallèle (1 à 20)"
        default: "3"
      publier:
        description: "Publier les MP3 dans une Release du dépôt"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preparer:
    runs-on: ubuntu-latest
    outputs:
      lots: ${{ steps.lots.outputs.lots }}
    steps:
      - id: lots
        run: |
          n="${{ inputs.machines }}"
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          (( n < 1 )) && n=1; (( n > 20 )) && n=20
          echo "lots=$(seq -s, 1 $n | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"

  lire:
    needs: preparer
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        lot: ${{ fromJSON(needs.preparer.outputs.lots) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Pocket TTS (version processeur, sans carte graphique)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q pocket-tts num2words
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pocket-tts-french_24l-v1
      - name: Lire les chapitres du lot ${{ matrix.lot }}
        run: |
          python3 scripts/synthese.py --epub "${{ inputs.epub }}" \
            --auteur "${{ inputs.auteur }}" --titre "${{ inputs.titre }}" \
            --chapitres "${{ inputs.chapitres }}" --voix "${{ inputs.voix }}" \
            --lot "${{ matrix.lot }}/${{ strategy.job-total }}" --sortie audio
      - uses: actions/upload-artifact@v4
        with:
          name: lot-${{ matrix.lot }}
          path: audio/
          if-no-files-found: ignore

  assembler:
    needs: lire
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: lots
      - name: Réunir les chapitres et faire le bilan
        run: |
          mkdir -p livre
          find lots -type f \( -name '*.mp3' -o -name '*.txt' \) -exec cp {} livre/ \;
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          r = [x for f in glob.glob("lots/*/rapport-*.json") for x in json.load(open(f))]
          r.sort(key=lambda x: x["chapitre"])
          print("## ${{ inputs.auteur }} — ${{ inputs.titre }} (voix ${{ inputs.voix }})\n")
          print("| Chapitre | Durée audio | Temps de calcul | Vitesse |")
          print("|---|---|---|---|")
          for x in r:
              print(f"| {x['titre'][:70]} | {x['duree']/60:.1f} min | {x['calcul']/60:.1f} min | ×{x['duree']/x['calcul']:.2f} |")
          if r:
              d = sum(x["duree"] for x in r); c = sum(x["calcul"] for x in r)
              print(f"\n**Total : {d/60:.0f} min d'audio, {c/60:.0f} min de calcul cumulé, ×{d/c:.2f} temps réel par machine.**")
              print(f"\nÀ cette vitesse, une heure de livre audio demande environ {60/(d/c):.0f} min de calcul par machine.")
          EOF
          ls -la livre
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.identifiant }}-${{ inputs.voix }}
          path: livre/
      - name: Publier dans une Release
        if: inputs.publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="synthese-${{ inputs.identifiant }}-${{ inputs.voix }}"
          notes="${{ inputs.auteur }}, ${{ inputs.titre }} — lu par une voix de synthèse (IA).
          Pocket TTS © Kyutai (CC BY 4.0), voix ${{ inputs.voix }}. Texte du domaine public (Wikisource).
          Enregistrements placés dans le domaine public (CC0 1.0)."
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "${{ inputs.titre }} — voix de synthèse (${{ inputs.voix }})" --notes "$notes"
          gh release upload "$tag" livre/*.mp3 -R "$GITHUB_REPOSITORY" --clobber
